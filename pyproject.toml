[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landslide-segmentation-benchmark"
version = "1.1.0"
description = "Reproducible AEF spatiotemporal landslide benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "rasterio>=1.3",
  "torch>=2.1",
  "tqdm>=4.66",
  "xarray>=2023.1",
  "h5netcdf>=1.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
